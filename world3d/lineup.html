<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sloppy Pals 3D — Model Lineup</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
<style>html,body{margin:0;height:100%;background:#1b2416;overflow:hidden;font-family:system-ui,sans-serif}#hd{position:fixed;top:10px;left:0;right:0;text-align:center;color:#e9ffb0;font:800 26px system-ui;text-shadow:0 2px 0 #000}#hd small{display:block;font:500 13px system-ui;color:#cfe3a8}.lb{position:fixed;transform:translate(-50%,0);color:#fff;font:700 10px system-ui;text-shadow:0 1px 2px #000;white-space:nowrap;pointer-events:none}a{color:#e9ffb0}</style>
</head><body><div id="hd">Sloppy Pals — all 60 Blender models<small>50 Pals (procedural, card-colored) · 10 Commanders + player · drag to orbit · <a href="index.html">play</a></small></div>
<script src="js/cards.js"></script>
<script type="module">
import * as THREE from 'three';
import { loadCard, loadGLB, Actor } from './js/assets.js';
const R = new THREE.WebGLRenderer({ antialias: true }); R.setPixelRatio(/still=1/.test(location.search) ? 1 : Math.min(2, devicePixelRatio)); R.setSize(innerWidth, innerHeight);
R.toneMapping = THREE.ACESFilmicToneMapping; R.outputColorSpace = THREE.SRGBColorSpace; R.shadowMap.enabled = true; document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0x9fc7d8); S.fog = new THREE.Fog(0x9fc7d8, 40, 80);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
S.add(new THREE.HemisphereLight(0xeaf6ff, 0x4a5a2a, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(8, 18, 12); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 18, bottom: -18 }); S.add(sun);
const g = new THREE.Mesh(new THREE.CircleGeometry(40, 48), new THREE.MeshStandardMaterial({ color: 0x6f9a3c, roughness: 1 })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; S.add(g);
const actors = [], labels = [];
const pals = CARDS.filter(c => c.type !== 'Human'), hum = CARDS.filter(c => c.type === 'Human');
const COLS = 10, DX = 2.55, DZ = 3.1;
const put = (gl, x, z, name) => { const a = new Actor(gl); a.obj.position.set(x, 0, z); a.obj.rotation.y = 0; S.add(a.obj); actors.push(a);
 const d = document.createElement('div'); d.className = 'lb'; d.textContent = name; document.body.appendChild(d); labels.push({ d, p: new THREE.Vector3(x, 0, z + 0.9) }); };
const jobs = pals.map((c, i) => loadCard(c).then(gl => put(gl, (i % COLS - (COLS - 1) / 2) * DX, (Math.floor(i / COLS)) * DZ - 6, c.id + ' ' + c.name)));
hum.forEach((c, i) => jobs.push(loadCard(c).then(gl => put(gl, (i - 5) * 2.6, -10.5, c.name))));
jobs.push(loadGLB('assets/models/player.glb').then(gl => put(gl, 5 * 2.6, -10.5, 'Player')));
let th = 0, ph = 0.62, dist = 30, drag = null;
addEventListener('pointerdown', e => drag = [e.clientX, e.clientY]); addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; th -= (e.clientX - drag[0]) * 0.005; ph = Math.min(1.4, Math.max(0.15, ph + (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY]; });
addEventListener('wheel', e => dist = Math.min(70, Math.max(8, dist + e.deltaY * 0.02)));
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); R.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock(), tgt = new THREE.Vector3(0, 0, -2.5);
R.setAnimationLoop(() => { const dt = Math.min(0.05, clock.getDelta()); actors.forEach(a => a.update(dt));
 cam.position.set(tgt.x + Math.sin(th) * Math.cos(ph) * dist, tgt.y + Math.sin(ph) * dist, tgt.z + Math.cos(th) * Math.cos(ph) * dist); cam.lookAt(tgt);
 R.render(S, cam);
 for (const l of labels) { const v = l.p.clone().project(cam); l.d.style.left = (v.x * 0.5 + 0.5) * innerWidth + 'px'; l.d.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 'px'; l.d.style.display = v.z < 1 ? '' : 'none'; } });
const still = /still=1/.test(location.search);
Promise.all(jobs).then(() => { window.__lineupReady = actors.length; if (still) setTimeout(() => R.setAnimationLoop(null), 600); }, e => { window.__lineupErr = String(e); console.error(e); });
</script></body></html>
